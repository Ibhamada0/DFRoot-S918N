name: Build DFRoot S918N APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout standalone DFRoot S918N repository
        uses: actions/checkout@v4

      - name: Import original DFRoot sources on first run
        shell: bash
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            python3 tools/import_dfroot.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Import complete standalone DFRoot S918N Android source"
            git push origin HEAD:main
          else
            echo "Using standalone Android source from this repository."
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build requirements
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build DFRoot S918N APK
        run: |
          chmod +x gradlew build.sh
          ./build.sh
          cp dirtyfrag.apk DFRoot-S918N.apk
          test -s DFRoot-S918N.apk
          unzip -t DFRoot-S918N.apk | tail -1

      - name: Upload standalone DFRoot S918N APK
        uses: actions/upload-artifact@v4
        with:
          name: DFRoot-S918N-APK
          path: DFRoot-S918N.apk
          if-no-files-found: error
          retention-days: 30
