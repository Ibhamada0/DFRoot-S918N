name: Build and Release DFRoot S918N
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dfroot-s918n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout independent DFRoot S918N
        uses: actions/checkout@v4

      - name: Verify Android sources
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/java/df/root/MainActivity.java
          test -f app/src/main/res/layout/activity_main.xml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build requirements
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build and verify APK
        run: |
          chmod +x gradlew build.sh
          ./build.sh
          cp dirtyfrag.apk DFRoot-S918N.apk
          test -s DFRoot-S918N.apk
          unzip -t DFRoot-S918N.apk | tail -1
          sha256sum DFRoot-S918N.apk > DFRoot-S918N.apk.sha256

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFRoot-S918N-APK
          path: |
            DFRoot-S918N.apk
            DFRoot-S918N.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: DFRoot S918N | Premium UI | Build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            ## DFRoot S918N - Premium UI

            Modern dark control center with live device information, root-session
            status, boot switches, KernelSU Next Manager access and copyable logs.

            Experimental, not validated on SM-S918N firmware. Back up first.
            The APK uses the upstream project's debug signing key.

            Built from: ${{ github.sha }}
          files: |
            DFRoot-S918N.apk
            DFRoot-S918N.apk.sha256
          fail_on_unmatched_files: true
